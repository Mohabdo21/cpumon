---
name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem does this solve and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
      description: How should it work? Flags, output, UI changes?
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Issue/PR links, if any
